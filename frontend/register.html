<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="/assets/global.css">
    <script src="vendor/axios.min.js" defer></script>
    <script src="assets/js/common.js" defer></script>
    <script src="assets/js/register.js" defer></script>
</head>

<body>
    <header>
        <nav class="navigation">
            <div>
                <h1><a href="/"><span class="primary-text">Task</span>Flow</a></h1>
            </div>
            <div id="unauthed-links">
                <a href="/login.html" class="primary-text">Login</a>
                <a href="/register.html" class="primary-text">Register</a>
            </div>
            <div id="authed-links">
                <a href="/profile.html" class="primary-text">Dashboard</a>
                <a href="#" id="logout-link" class="primary-text">Logout</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="auth-page">
            <div class="auth-box">
                <h2>Register</h2>
                <form id="register-form">
                    <div>
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>

</html>
