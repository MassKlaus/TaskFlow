<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Projects</title>
    <link rel="stylesheet" href="assets/global.css" />
    <script src="vendor/axios.min.js" defer></script>
    <script src="assets/js/common.js" defer></script>
    <script src="assets/js/notifications.js" defer></script>
    <script src="assets/js/projects.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <div>
                <h1><a href="/"><span class="primary-text">Task</span>Flow</a></h1>
            </div>
            <div id="authed-links">
                <a href="/dashboard.html">Dashboard</a>
                <a href="/projects.html">Projects</a>
                <a href="/task.html">Create Task</a>
                <div class="notification-wrapper">
                    <a href="#" id="notification-bell"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none" /><g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path fill="none" stroke-dasharray="4" d="M12 3v2"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.2s" values="4;0" /></path><path fill="currentColor" fill-opacity="0" stroke-dasharray="30" stroke-dashoffset="30" d="M12 5c-3.31 0 -6 2.69 -6 6l0 6c-1 0 -2 1 -2 2h8M12 5c3.31 0 6 2.69 6 6l0 6c1 0 2 1 2 2h-8"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.2s" dur="0.4s" to="0" /><animate fill="freeze" attributeName="fill-opacity" begin="0.9s" dur="0.4s" to="1" /></path><path fill="none" stroke-dasharray="10" stroke-dashoffset="10" d="M10 20c0 1.1 0.9 2 2 2c1.1 0 2 -0.9 2 -2"><animate fill="freeze" attributeName="stroke-dashoffset" begin="0.7s" dur="0.2s" to="0" /></path></g></svg><span id="notification-badge" style="display:none">0</span></a>
                    <div id="notification-dropdown"></div>
                </div>
                <a href="#" id="logout-link">Logout</a>
            </div>
        </nav>
    </header>
    <main>
        <h1>Projects</h1>

        <section id="create-project" class="card">
            <h2>New Project</h2>
            <form id="project-form">
                <label>Title: <input type="text" name="title" required></label>
                <label>Description: <textarea name="description"></textarea></label>
                <label>Deadline: <input type="date" name="deadline"></label>
                <button type="submit">Create</button>
            </form>
        </section>

        <section id="project-list">
            <h2>Your Projects</h2>
            <div id="projects-container"></div>
            <div id="pagination" class="pagination">
                <button id="prev-page">&larr; Previous</button>
                <span id="page-info">Page 1</span>
                <button id="next-page">Next &rarr;</button>
            </div>
        </section>
    </main>
    <footer>
        <p>TaskFlow &copy; 2026</p>
    </footer>
</body>
</html>
